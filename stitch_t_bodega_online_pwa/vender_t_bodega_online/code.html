<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pb-safe-area-bottom">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex items-center justify-between px-md py-sm z-40">
<button class="w-tap h-tap flex items-center justify-center text-primary transition-transform active:scale-95 hover:opacity-80">
<span class="material-symbols-outlined">storefront</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Tú Bodega Online</h1>
<button class="w-tap h-tap flex items-center justify-center text-primary transition-transform active:scale-95 hover:opacity-80">
<span class="material-symbols-outlined">search</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-md gap-md overflow-y-auto">
<!-- Cart Area (Sticker Card) -->
<div class="bg-surface-container-lowest rounded-sticker border border-outline-variant shadow-sticker p-md flex flex-col gap-sm">
<div class="flex justify-between items-center pb-xs border-b border-surface-variant">
<span class="font-body-sm text-outline font-bold">CARRITO (2)</span>
<button class="text-primary font-label-caps h-tap flex items-center px-sm transition-transform active:scale-95 hover:opacity-80">VACIAR</button>
</div>
<!-- Cart Items -->
<div class="flex flex-col gap-xs max-h-[150px] overflow-y-auto pr-xs">
<!-- Item 1 -->
<div class="flex items-center gap-sm p-xs rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-[48px] h-[48px] rounded-[20%] object-cover border border-outline-variant" data-alt="A small, stylized digital illustration of a yellow corn flour packet typical of Venezuelan grocery stores, rendered in a clean, modern UI style with solid vibrant colors and high contrast on a pure white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzdtusn9M_PDZdbiqr4xWiEfR8LzUfwQshCOnHdszs3NHXbwEq2qx7QkmDidm6Cy-Gikop__6qrM0Y2kR4UZiP5iQPnblNGLY31n9KGwnRn699_ThYCgabet0MZb1R3H2ALUG3LkB_aUNJ0T5LHwg8mrh-AnT4XlmXFAK9FOS_hEadJMtQs6RyXC80rIs9G7c6kTIGfUZvgJYkeZHXT5xgY-EbxqcNiH-NwF-DkPXVyRKDeJ3lKOQ"/>
<div class="flex-grow">
<h3 class="font-body-lg text-on-surface truncate">Harina P.A.N.</h3>
<div class="flex gap-sm">
<span class="font-price-primary text-primary">$1.20</span>
<span class="font-price-secondary text-outline self-end mb-0.5">54.00 Bs</span>
</div>
</div>
<button class="h-tap w-tap flex items-center justify-center text-outline transition-transform active:scale-95 hover:text-error">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Item 2 -->
<div class="flex items-center gap-sm p-xs rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-[48px] h-[48px] rounded-[20%] object-cover border border-outline-variant" data-alt="A small, stylized digital illustration of a white rice bag typical of Venezuelan grocery stores, rendered in a clean, modern UI style with solid vibrant colors and high contrast on a pure white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3dkjLw4HbWLN4By_K8-0ZyhqYrxSqmL18A_sFPVGp9fQsbkKkww0UCSV-8FyhODJLSg9bdUlJMmGDuZZacZDVJIEPxIV60CDSEk1LEZQMYyZZxqx8CYrvyoziC3quJUcFIB_YCG6odUybQMnLSUF2_ZJZoXh_87qJOytjQaY6fAQKYi2uKceAUOhkG7ryDK50y4IcVd6ZDibL0tZirgDCguhJLIPdEl-0yT7z8MSMuvNOGqVdpqc"/>
<div class="flex-grow">

<div class="flex gap-sm">
<span class="font-price-primary text-primary">$1.00</span>
<span class="font-price-secondary text-outline self-end mb-0.5">45.00 Bs</span>
</div>
</div>
<button class="h-tap w-tap flex items-center justify-center text-outline transition-transform active:scale-95 hover:text-error">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Total -->
<div class="flex justify-between items-end pt-sm border-t border-surface-variant mt-xs">
<span class="font-body-lg text-on-surface font-bold">TOTAL</span>
<div class="flex flex-col items-end">
<span class="font-headline-md text-headline-md text-primary">$2.20</span>
<span class="font-price-secondary text-outline">99.00 Bs</span>
</div>
</div>
</div>
<!-- Quick Entry / Scan -->
<div class="flex gap-sm">
<div class="flex-grow bg-surface-container-lowest rounded-sticker border border-outline-variant shadow-sticker h-[56px] flex items-center px-md focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-outline mr-sm">keyboard</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-on-surface placeholder:text-outline p-0" placeholder="Ingresar monto manual..." readonly="" type="text" value="$ 0.00"/>
</div>
<button class="w-[56px] h-[56px] bg-primary rounded-sticker flex items-center justify-center text-on-primary shadow-sticker transition-transform active:scale-95 hover:opacity-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
</button>
</div>

<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">1</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">2</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">3</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">4</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">5</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">6</button>

<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">8</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">9</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">00</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center font-headline-md text-headline-md text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">0</button>
<button class="bg-surface-container-lowest rounded-sticker border border-outline-variant h-[64px] flex items-center justify-center text-on-surface shadow-sticker transition-transform active:scale-95 hover:bg-surface-container-low">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Action Button -->
<button class="w-full h-[56px] rounded-full bg-magenta-vibrant flex items-center justify-center gap-sm font-headline-md text-headline-md text-on-primary shadow-sticker transition-transform active:scale-95 mb-md sticky bottom-md z-30">
            Cobrar $2.20

</button>

<nav class="fixed bottom-0 w-full z-50 h-[80px] bg-surface-container-lowest border-t border-outline-variant shadow-[0px_-4px_20px_rgba(122,40,245,0.08)] flex justify-around items-center px-xs pb-safe-area-bottom md:hidden">
<!-- Inicio (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all duration-200 active:scale-90 w-tap h-tap" href="#">

</a>
<!-- Productos (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all duration-200 active:scale-90 w-tap h-tap" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-caps text-label-caps mt-1">Productos</span>
</a>
<!-- Vender (Active - Magenta Elevated) -->
<a class="flex flex-col items-center justify-center font-bold bg-magenta-vibrant text-on-primary rounded-full -mt-8 w-16 h-16 shadow-lg transition-all duration-200 active:scale-90 border-[4px] border-background relative" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_shopping_cart</span>

<span class="material-symbols-outlined">payments</span>

</a>
